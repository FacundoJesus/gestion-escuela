<html: lang="es">
    <head> 
        <title>Gestión de escuela</title>
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=devise-width,initial-scale=1.0"> 
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <header>
            <h1>Gestión de escuela</h1>
            <p class="subtitulo">
                Clase 1: Fundamentos de JavaScript
            </p>
        </header>  
    
        <main>

            <section class="tarjeta">
                <h2>Cargar alumno</h2>
                <form id="formAlumno" novalidate>
                    <div>
                        <label for="inputNombre">Nombre del alumno</label>
                        <input type="text" id="inputNombre" placeholder="Ejemplo: Perez Gil" autocomplete="off">
                    </div>

                    <div>
                        <label for="selectMateria">Materia</label>
                        <select id="selectMateria"></select>
                    </div>

                    <div>
                        <label for="inputNota">Nota (1-10)</label>
                        <input type="number" id="inputNota" min="1" max="10" step="1" placeholder="Ej. 8">
                    </div>

                    <button type="submit">
                        Agregar alumno
                    </button>
                </form>
                <p id="mensaje" class="mensaje"></p>

            </section >
           

            <section class="tarjeta">
                 <h2>Listado de alumnos</h2>
                 <div class="campo campo-filtro">
                    <!--for permite linkear el evento focus al elemento id del mismo nombre-->
                    <label for="filtroMateria">Filtrar por materia</label>
                    <select id="filtroMateria"></select>
                    <!-- Seccion: 3: TABLA-->
                     <table>
                        <thead> 
                            <tr>
                                <th>Nombre</th>
                                <th>Materia</th>
                                <th>Nota</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                        </tbody>
                     </table>
                 </div>
            </section>

            <!-- Seccion: 4: ESTADISTICAS -->
            <section class="tarjeta estadisticas">
                <div class="stat">
                    <span class="stat-numero" id="totalAlumnos">5</span>Alumnos
                </div>
                <div class="stat">
                    <span class="stat-numero" id="promedioGeneral">6.9</span>Promedio
                </div>
                <div class="stat">
                    <span class="stat-numero" id="totalAprobados">4</span>Aprobados
                </div>
            </section>
        
        </main>

    <footer>
        <p>Abri la <canvas></canvas>onsola del navegrador con <kbd>F12</kbd>
            para ver los mensajes de la clase.
        </p>
    </footer>

    <script src="scripts/app.js"></script>
    </body>




</html>
